# Secure delivery (Assessment 11): tag vX.Y.Z → versioned images + SBOM + keyless cosign signature → staging deploy +
# smoke → manual approval (GitHub Environment "production" with required reviewers) → production deploy with automatic
# rollback on failed smoke. A separate manual "rollback" run redeploys any earlier signed tag.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Tag to roll production back to (e.g. v1.2.0)"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/fincore

jobs:
  build-sign:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write } # id-token: keyless cosign (OIDC)
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/node-service.Dockerfile, app: api }
          - { name: workers, dockerfile: infra/docker/node-service.Dockerfile, app: workers }
          - { name: web, dockerfile: infra/docker/web.Dockerfile, app: "" }
          - { name: analytics, dockerfile: infra/docker/analytics.Dockerfile, app: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: true
          provenance: true
          sbom: true # SPDX SBOM attached to the image
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - name: Scan the released image (Trivy)
        run: |
          docker run --rm aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  deploy-staging:
    needs: build-sign
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Verify signatures before deploying
        run: |
          for s in api workers web analytics; do
            cosign verify "${{ env.REGISTRY }}/$s:${{ github.ref_name }}" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - name: Deploy + smoke (auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: fincore
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: cd /opt/fincore && git fetch --tags && git checkout ${{ github.ref_name }} && ./infra/deploy/deploy.sh staging ${{ github.ref_name }}

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # required reviewers = manual approval gate
    steps:
      - name: Deploy + smoke (auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: fincore
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: cd /opt/fincore && git fetch --tags && git checkout ${{ github.ref_name }} && ./infra/deploy/deploy.sh production ${{ github.ref_name }}

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Redeploy an earlier signed tag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: fincore
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: cd /opt/fincore && git fetch --tags && git checkout ${{ inputs.rollback_to }} && ./infra/deploy/deploy.sh production ${{ inputs.rollback_to }}
