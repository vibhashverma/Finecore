# FinCore base stack. Values come from .env (copy .env.example). Overrides:
#   local dev ports:   docker compose -f compose.yaml -f infra/compose/compose.dev.yaml up
#   production-like:   docker compose -f compose.yaml -f infra/compose/compose.prod.yaml up
name: fincore

x-app-env: &app-env
  APP_ENV: ${APP_ENV}
  LOG_LEVEL: ${LOG_LEVEL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  ANALYTICS_URL: http://analytics:8000
  ANALYTICS_TOKEN: ${ANALYTICS_TOKEN}
  MFA_ENC_KEY: ${MFA_ENC_KEY}
  JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
  JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-SIMULATOR}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  WEBHOOK_TARGET_URL: http://api:4000/api/v1/webhooks/payments
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SMTP_URL: smtp://mailpit:1025

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER} # superuser: used ONLY by the one-time role bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      FINCORE_OWNER_PASSWORD: ${FINCORE_OWNER_PASSWORD}
      FINCORE_API_PASSWORD: ${FINCORE_API_PASSWORD}
      FINCORE_WORKERS_PASSWORD: ${FINCORE_WORKERS_PASSWORD}
      FINCORE_ANALYTICS_PASSWORD: ${FINCORE_ANALYTICS_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roles.sql is mounted outside initdb.d (it needs psql variables); the .sh hook runs it once.
      - ./db/bootstrap/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./db/bootstrap/roles.sql:/fincore/bootstrap/roles.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate: # One-shot: applies db/migrations as the schema owner, then exits.
    image: ghcr.io/amacneil/dbmate:2.38.2
    command: ["--wait", "--wait-timeout", "60s", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://fincore_owner:${FINCORE_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./db/migrations:/db/migrations:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  mailpit: # Email SANDBOX: catches all outgoing mail; nothing is delivered.
    image: axllent/mailpit:latest
    networks: [data]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { APP: api }
    image: fincore/api:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      API_PORT: 4000
      # Least-privilege runtime role (ADR-006), never the owner or superuser.
      DATABASE_URL: postgres://fincore_api:${FINCORE_API_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [app, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  workers:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { APP: workers }
    image: fincore/workers:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 4100
      DATABASE_URL: postgres://fincore_workers:${FINCORE_WORKERS_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s

  analytics:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/docker/analytics.Dockerfile
    image: fincore/analytics:${IMAGE_TAG:-local}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      ANALYTICS_APP_ENV: ${APP_ENV}
      ANALYTICS_LOG_LEVEL: ${ANALYTICS_LOG_LEVEL}
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN}
      # Read-only role: analytics views only (ADR-006).
      ANALYTICS_DATABASE_URL: postgresql://fincore_analytics:${FINCORE_ANALYTICS_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [app, data]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 25s

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: fincore/web:${IMAGE_TAG:-local}
    environment:
      API_INTERNAL_URL: http://api:4000
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [edge, app]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  edge: {} # the only network with published ports
  app: { internal: true } # caddy <-> web/api/analytics
  data: { internal: true } # postgres, redis, mailpit: never reachable from the host or internet
  egress: {} # outbound only, for workers (payment provider sandbox)

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
