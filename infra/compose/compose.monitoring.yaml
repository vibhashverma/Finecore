# Monitoring add-on (staging/prod): Prometheus + Alertmanager + blackbox uptime + Grafana. Internal networks only;
# Grafana is reached through an SSH tunnel (never published publicly).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/monitoring/prometheus.rendered.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [app, data, egress]
    restart: always
  alertmanager:
    image: prom/alertmanager:v0.28.1
    networks: [app]
    restart: always
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    networks: [app, egress]
    restart: always
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"] # SSH tunnel only
    volumes: [grafanadata:/var/lib/grafana]
    networks: [app, devhost]
    restart: always
networks:
  devhost: {}
volumes:
  promdata:
  grafanadata:
